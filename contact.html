<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Art of Sirio</title>
<meta name="description" content="Get in touch with Alessandro Sirio Ceresa for commissions, collaborations and projects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#141414;--fg:#eeeeec;--mute:#8e8e8a;--line:#2b2b2a;--pad:clamp(16px,3vw,40px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:400 16px/1.6 'Hanken Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
img{display:block;width:100%;height:auto}
header,footer{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px 32px;padding:20px var(--pad)}
.logo{font-weight:600;font-size:18px;letter-spacing:-.01em}
nav,footer div{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:15px;color:var(--mute)}
nav a:hover,footer a:hover{color:var(--fg)}
nav a[aria-current]{color:var(--fg);text-decoration:underline;text-underline-offset:6px}
footer{font-size:13px;color:var(--mute);padding-top:40px}
main{flex:1;padding:0 var(--pad) 40px}
h1{font-weight:600;letter-spacing:-.03em;line-height:1.05}

/* contact */
.contact{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,5vw,72px);align-items:start;padding-top:12px}
.info h1{font-size:clamp(36px,5.5vw,76px);margin-bottom:28px}
.lead{font-size:clamp(18px,1.8vw,24px);line-height:1.45;max-width:30em;margin-bottom:32px}
.links{list-style:none;font-size:15px;color:var(--mute)}
.links li+li{margin-top:6px}
.links a{color:var(--fg)}
.links a:hover{color:var(--mute)}

/* form */
form{display:grid;gap:24px}
label{display:block;font-size:15px;color:var(--mute)}
input,textarea{display:block;width:100%;margin-top:8px;padding:12px 14px;font:inherit;color:var(--fg);
  background:transparent;border:1px solid var(--line);border-radius:0;transition:border-color .2s}
input:hover,textarea:hover{border-color:var(--mute)}
input:focus,textarea:focus{outline:none;border-color:var(--fg)}
textarea{min-height:200px;resize:vertical}
button[type="submit"]{justify-self:start;font:600 15px/1 'Hanken Grotesk',system-ui,sans-serif;color:var(--bg);
  background:var(--fg);border:1px solid var(--fg);padding:14px 32px;cursor:pointer;transition:background .2s,color .2s}
button[type="submit"]:hover{background:transparent;color:var(--fg)}

@media(max-width:800px){.contact{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html">ALESSANDRO SIRIO CERESA</a>
  <nav>
    <a href="conceptart.html">Concept Art</a>
    <a href="illustration.html">Illustration</a>
    <a href="sketchbook.html">Sketchbook</a>
    <a href="worldbuilding.html">Worldbuilding</a>
    <a href="about.html">About Me</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main>
  <div class="contact">

    <div class="info">
      <h1>Contact</h1>
      <p class="lead">Let's talk about your idea. Send me a message about your project, collaboration or commission.</p>
      <ul class="links">
        <li><a href="mailto:sirioartist@gmail.com">sirioartist@gmail.com</a></li>
        <li><a href="https://www.instagram.com/artofsirio/" target="_blank" rel="noopener">Instagram</a></li>
        <li><a href="https://www.artstation.com/alessandroceresa" target="_blank" rel="noopener">ArtStation</a></li>
      </ul>
    </div>

    <form action="https://formspree.io/f/xykayabr" method="POST">
      <label>
        Your email
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label>
        Your message
        <textarea name="message" required></textarea>
      </label>
      <button type="submit">Send</button>
    </form>

  </div>
</main>

<footer>
  <span>© 2026 Art of Sirio</span>
</footer>

</body>
</html>
