<style>
:root{--bg:#141414;--fg:#eeeeec;--mute:#8e8e8a;--line:#2b2b2a;--pad:clamp(16px,3vw,40px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:400 16px/1.6 'Hanken Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
img{display:block;width:100%;height:auto}
header,footer{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px 32px;padding:20px var(--pad)}
.logo{font-weight:600;font-size:18px;letter-spacing:-.01em}
nav,footer div{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:15px;color:var(--mute)}
nav a:hover,footer a:hover{color:var(--fg)}
nav a[aria-current]{color:var(--fg);text-decoration:underline;text-underline-offset:6px}
footer{font-size:13px;color:var(--mute);padding-top:40px}
main{flex:1;padding:0 var(--pad) 40px}
h1{font-weight:600;letter-spacing:-.03em;line-height:1.05}
.sec{padding:24px 0 32px}
.sec h1{font-size:clamp(28px,4vw,48px)}
.sec p{color:var(--mute);max-width:60ch;margin-top:8px}

/* mosaico: le immagini mantengono la loro proporzione e si incastrano a colonne */
.mosaic{columns:4 240px;column-gap:12px}
.piece{position:relative;display:block;width:100%;margin:0 0 12px;padding:0;border:0;overflow:hidden;
  background:var(--line);color:#fff;text-align:left;font:inherit;cursor:zoom-in;break-inside:avoid}
.piece img{transition:transform .5s}
.piece:hover img{transform:scale(1.04)}
/* titolo, data e descrizione nascosti nel mosaico: si leggono solo nell'anteprima */
.meta{display:none}

/* anteprima a schermo intero */
dialog{border:0;padding:0;width:100%;height:100%;max-width:none;max-height:none;background:rgba(10,10,10,.97);color:#fff}
dialog::backdrop{background:#000}
.lbx{height:100%;display:grid;grid-template-columns:1fr 340px;gap:32px;align-items:center;padding:var(--pad)}
.view{height:100%;min-height:0;display:grid;place-items:center}
.view img{width:auto;height:auto;max-width:100%;max-height:calc(100vh - 2 * var(--pad));object-fit:contain}
.panel h2{font-size:clamp(20px,2.4vw,28px);font-weight:600;line-height:1.15;letter-spacing:.06em;text-transform:uppercase}
.panel time{display:block;color:var(--mute);font-size:14px;margin-top:6px}
.panel .txt{margin-top:20px;color:#d6d6d3;max-width:44ch}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;margin-top:32px;font-size:14px}
.ctrl button{font:inherit;color:#fff;background:none;border:0;padding:6px 0;cursor:pointer;border-bottom:1px solid transparent}
.ctrl button:hover{border-color:#fff}
.count{color:var(--mute)}
.ctrl .close{margin-left:auto}

@media(max-width:800px){
  .lbx{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:16px}
  .view img{max-height:60vh}
}
@media(max-width:560px){.mosaic{columns:2}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
  const items = [...document.querySelectorAll('.piece')];
  const lb = document.getElementById('lb');
  const img = lb.querySelector('.view img');
  const title = lb.querySelector('h2');
  const date = lb.querySelector('.panel time');
  const text = lb.querySelector('.txt');
  const count = lb.querySelector('.count');
  let i = 0;

  // Riempie l'anteprima con i dati del disegno scelto (letti dai testi nascosti nel mosaico)
  function show(n) {
    i = (n + items.length) % items.length;
    const p = items[i];
    const t = p.querySelector('time');
    img.src = p.querySelector('img').src;
    img.alt = p.querySelector('.t').textContent;
    title.textContent = p.querySelector('.t').textContent;
    date.textContent = t.textContent;
    date.dateTime = t.dateTime;
    text.textContent = p.querySelector('.desc').textContent;
    count.textContent = (i + 1) + ' / ' + items.length;
  }

  items.forEach((p, n) => p.addEventListener('click', () => { show(n); lb.showModal(); }));
  lb.querySelector('.prev').addEventListener('click', () => show(i - 1));
  lb.querySelector('.next').addEventListener('click', () => show(i + 1));
  lb.querySelector('.close').addEventListener('click', () => lb.close());
  // clic sullo sfondo = chiude; frecce da tastiera = scorre; Esc = chiude
  lb.addEventListener('click', e => { if (!e.target.closest('img, .panel')) lb.close(); });
  lb.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') show(i + 1);
    if (e.key === 'ArrowLeft') show(i - 1);
  });
</script>
